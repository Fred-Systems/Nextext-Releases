<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" id="nx-viewport" />
    <meta name="theme-color" content="#00A884" />
    <title>nextext</title>
    <style>html,body,#root{background:#0B141A !important;margin:0;padding:0;height:100%;width:100%;overflow:hidden;position:relative;}#nextext-app-shell{height:100%;height:100dvh;}</style>
    <script>
    window.__nxCapturedErrors = [];
    window.nxFail = function(msg) {
      window.__nxCapturedErrors.push('FAIL: ' + msg);
    };
    window.addEventListener('error', function(e) {
      window.__nxCapturedErrors.push('ERROR: ' + (e.message||'?') + ' | ' + (e.filename||'?') + ':' + (e.lineno||'?') + ':' + (e.colno||'?') + ' | ' + ((e.error&&e.error.stack)||'no stack'));
    });
    window.addEventListener('unhandledrejection', function(e) {
      var r = e.reason || {};
      window.__nxCapturedErrors.push('REJECT: ' + (r.message || String(r)) + ' | ' + (r.stack || 'no stack'));
    });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body style="margin:0;background:#0B141A;">
    <div id="nx-boot-error" style="position:fixed;inset:0;z-index:999999;pointer-events:none;overflow:auto;display:none;"></div>
    <div id="root">
      <div style="height:100vh;background:#0B141A;"></div>
    </div>
<noscript>
      <div style="position:fixed;inset:0;z-index:99999999;background:#FF3B30;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 18px sans-serif;text-align:center;padding:32px;">
        JavaScript is disabled. NexText requires JavaScript to run.
      </div>
    </noscript>
  </body>
</html>
